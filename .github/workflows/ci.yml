# CI — honesty-harness-toolkit
# Matriz {3.12, 3.14} × {ubuntu, windows}. SIN red más allá de pip: ningún
# paso descarga datos de mercado (los tests usan sintético generado in-situ).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Import smokes (18 módulos)
        run: pytest -q tests/test_import_smokes.py
      - name: Full test suite
        run: pytest -q
